<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080e17">
  <meta name="description" content="BYTE / GLITCH — a 30 FPS audio-reactive, simulated-qubit visualizer. Play NEGATIVE VELOCITY or upload your own track.">
  <meta property="og:title" content="BYTE / GLITCH — Qubit Player">
  <meta property="og:description" content="A 30 FPS byte-glitch visualizer. Listen to NEGATIVE VELOCITY or upload a song.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <title>BYTE / GLITCH — Qubit Player</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="masthead">
      <div class="brand">
        <div class="eyebrow">AUDIO REACTIVE / SIMULATED QUBITS</div>
        <h1>BYTE<span class="slash"> / </span>GLITCH</h1>
      </div>
      <div class="fps-indicator"><span class="fps-dot" aria-hidden="true"></span> 30 FPS</div>
    </header>

    <section class="visualizer" aria-label="Eight-state audio visualizer with three simulated qubit spheres">
      <canvas id="visual" role="img" aria-label="Animated eight-state amplitude ring with three simulated qubit states, driven by music"></canvas>
    </section>

    <section class="player" aria-label="Audio player">
      <div class="track-row">
        <div class="track-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div class="track-info">
          <div class="track-title" id="trackTitle">NEGATIVE VELOCITY</div>
          <div class="track-detail" id="trackDetail">DEMO TRACK <span aria-hidden="true">·</span> READY TO PLAY</div>
        </div>
        <div class="track-time" id="trackTime" aria-label="Track position">0:00 / 2:46</div>
      </div>
      <div class="progress-track" role="progressbar" id="progress" aria-label="Playback progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div>
      <div class="actions">
        <button id="play" class="primary" type="button" aria-label="Play demo song">
          <svg id="playIcon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M8 5.6a1 1 0 0 1 1.53-.85l9.15 6.4a1 1 0 0 1 0 1.7l-9.15 6.4A1 1 0 0 1 8 18.4V5.6z"/></svg>
          <span id="playText">Play demo</span>
        </button>
        <button id="upload" class="secondary" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V3m-5 5 5-5 5 5"/><path d="M4 16v4h16v-4"/></svg>
          <span>Upload song</span>
        </button>
        <input id="fileInput" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac" aria-label="Choose an audio file">
      </div>
      <p class="feedback" id="feedback" role="status" aria-live="polite">Your uploaded audio stays on your device.</p>
    </section>
    <footer>ARTIFICIALFLOWERS <span class="footer-divider">/</span> A LOCAL-FIRST AUDIO EXPERIENCE</footer>
  </main>
  <audio id="audio" preload="metadata" playsinline>
    <source src="assets/negative-velocity.mp3" type="audio/mpeg">
  </audio>
</body>
</html>
